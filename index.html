<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Durgotsav &amp; Navratri Samiti</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================
           RESET & CSS VARIABLES
           ========================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #851326;
            --primary-dark: #5c0b19;
            --gold: #c9933e;
            --gold-light: #f3e5c8;
            --bg-radial-1: #fff8f0;
            --bg-radial-2: #f4ece1;
            /* Semi-transparent so the background logo shows subtly through the card */
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(201, 147, 62, 0.28);
            --text-main: #2b1f21;
            --text-muted: #6e5f62;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            background: radial-gradient(circle at 50% 15%, var(--bg-radial-1) 0%, var(--bg-radial-2) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 16px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* =========================
           TRANSPARENT BACKGROUND LOGO
           ========================= */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("logo.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: min(520px, 80vw) auto;
            
            /* High transparency level */
            opacity: 0.08;

            /* Removes solid white boxes if logo.png is not pre-cut as transparent */
            mix-blend-mode: multiply;

            z-index: 0;
            pointer-events: none;
        }

        /* Ambient festival glow */
        .ambient-glow {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 350px;
            background: radial-gradient(circle, rgba(201, 147, 62, 0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* =========================
           CONTAINER (FROSTED GLASS)
           ========================= */
        .container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 44px 32px 36px;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.03),
                0 20px 40px -15px rgba(110, 20, 35, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
        }

        .decorative-bar {
            width: 70px;
            height: 3px;
            margin: 0 auto 20px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 99px;
        }

        /* =========================
           TYPOGRAPHY
           ========================= */
        h1 {
            font-family: 'Cinzel', serif;
            text-align: center;
            font-size: clamp(23px, 5.5vw, 29px);
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary);
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14.5px;
            font-weight: 500;
            margin-bottom: 32px;
            letter-spacing: 0.2px;
        }

        /* =========================
           BUTTON LIST
           ========================= */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--primary-dark);
            text-decoration: none;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            font-size: 15.5px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            font-size: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: #fcf6ee;
            border-radius: 10px;
            flex-shrink: 0;
            border: 1px solid rgba(201, 147, 62, 0.25);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .chevron {
            color: var(--gold);
            font-size: 18px;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        /* Hover & Tap States */
        .form-button:hover {
            background: #ffffff;
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(133, 19, 38, 0.08);
            color: var(--primary);
        }

        .form-button:hover .btn-icon {
            transform: scale(1.08);
            background: #faede0;
        }

        .form-button:hover .chevron {
            transform: translateX(3px);
        }

        .form-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        /* =========================
           INSTAGRAM SECTION (MIDDLE BOTTOM)
           ========================= */
        .social-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px dashed rgba(201, 147, 62, 0.35);
        }

        .instagram-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(225, 48, 108, 0.25);
            color: #4a3b3d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            transition: all 0.25s ease;
        }

        .ig-icon {
            width: 20px;
            height: 20px;
            display: block;
        }

        .instagram-btn:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(220, 39, 67, 0.28);
        }

        .instagram-btn:hover .ig-icon path,
        .instagram-btn:hover .ig-icon circle {
            stroke: #ffffff;
        }

        .instagram-btn:active {
            transform: translateY(0);
        }

        /* =========================
           FOOTER
           ========================= */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* =========================
           MOBILE OPTIMIZATIONS
           ========================= */
        @media (max-width: 480px) {
            body {
                padding: 24px 14px;
            }

            .container {
                padding: 32px 18px 26px;
                border-radius: 20px;
            }

            .form-button {
                padding: 13px 15px;
                font-size: 14.5px;
            }

            .btn-icon {
                width: 34px;
                height: 34px;
                font-size: 17px;
            }

            .social-section {
                margin-top: 22px;
                padding-top: 18px;
            }

            .instagram-btn {
                padding: 9px 18px;
                font-size: 13.5px;
            }
        }
    </style>
</head>

<body>

</body>

</html>
